name: release
# Tag a version (git tag v0.3.0 && git push --tags) to publish binaries for the install script.
# Built inside rust:bookworm so the binaries only need glibc 2.36 (Debian 12 and newer).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: build
        env:
          ZCODE_COMMIT: ${{ github.sha }}
          ZCODE_DEFAULT_REPO: ${{ github.repository }}
        run: |
          export ZCODE_COMMIT=$(echo "$ZCODE_COMMIT" | cut -c1-7)
          rustup target add $(uname -m)-unknown-linux-musl
          cargo build --release --locked
          mkdir dist && cp target/release/zcode dist/
          tar -C dist -czf zcode-linux-${{ matrix.arch }}.tar.gz zcode
          sha256sum zcode-linux-${{ matrix.arch }}.tar.gz > zcode-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ matrix.arch }}
          path: zcode-linux-${{ matrix.arch }}.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
