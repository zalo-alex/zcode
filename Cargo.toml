[package]
name = "zcode"
version = "0.3.3"
edition = "2024"
description = "Fast, lightweight terminal coding agent"
license = "MIT"
build = "build.rs"

[features]
# `zcode image pull` in-process (registry client, sha256, gzip); without it `image pull` shells out to skopeo + umoci
oci = ["zcode-tools/oci"]

[workspace]
members = [".", "crates/zcode-tools", "crates/zcode-guest"]

[dependencies]
zcode-tools = { path = "crates/zcode-tools" }
libc = "0.2"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "fs"] }

[profile.release]
# size first: a smaller binary touches fewer pages at startup (idle RSS) and is a third smaller. Measured (bench/sandbox/toolcpu.py):
# full-tree grep, with and without literal prefixes, is no slower than at opt-level 3, because the hot loops are memory-bound.
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# `cargo build --profile serve`: same as release but panics unwind, so `zcode serve` can isolate a panic to one instance
[profile.serve]
inherits = "release"
panic = "unwind"
