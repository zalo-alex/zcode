[package]
name = "zcode"
version = "0.2.0"
edition = "2024"
description = "Fast, lightweight terminal coding agent"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "fs"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
